---
apiVersion: gateway.mulesoft.com/v1alpha1
kind: Extension
metadata:
  labels:
    title: IDMC Data Quality Gate
    category: Quality of Service
    description: >-
      Gates MCP tool calls and A2A message-send invocations on a CDGC-governed
      asset's data quality score, warning or blocking when it falls below
      configurable thresholds. The score is cached and refreshed lazily, so most
      requests are a fast local read.
    metadata/capabilities/injectionPoint: inbound
    metadata/capabilities/assetTypes: mcp,a2a,a2a_v1
    metadata/interfaceScope: api,resource
spec:
  extends:
    - name: extension-definition
      namespace: default
  properties:
    cdgcLoginUrl:
      type: string
      format: service
      description: >-
        IDMC login base URL for this org, e.g. https://dmp-us.informaticacloud.com.
        Region/POD prefix (dm- vs dmp-) is org-specific — do not assume, verify per org.
    cdgcBaseApiUrl:
      type: string
      format: service
      description: >-
        CDGC base API URL for this org, e.g. https://idmc-api.dmp-us.informaticacloud.com.
        Not reliably returned by the Login API response in all orgs — configure explicitly.
    cdgcOrgUsername:
      type: string
      description: IDMC service-account username used to authenticate to CDGC.
      "@context":
        "@characteristics":
          - security:sensitive
    cdgcOrgPassword:
      type: string
      description: IDMC service-account password.
      "@context":
        "@characteristics":
          - security:sensitive
    cdgcAssetId:
      type: string
      description: >-
        Internal ID of the single CDGC asset this policy instance monitors
        (same ID shown in the CDGC UI's asset URL).
    warnThreshold:
      type: number
      minimum: 0
      maximum: 100
      default: 90
      description: >-
        If the asset's current DQ score is below this value (and at or above
        blockThreshold), the request is allowed through but flagged with a warning.
    blockThreshold:
      type: number
      minimum: 0
      maximum: 100
      default: 80
      description: >-
        If the asset's current DQ score is below this value, the request is
        rejected before it reaches the upstream MCP server or A2A agent.
    scoreAggregation:
      type: string
      default: min
      enum:
        - min
        - average
      description: >-
        How to combine multiple DQ dimensions (Completeness, Validity, Accuracy, ...)
        returned for the asset into the single score compared against thresholds.
        min is the conservative default — the worst dimension gates the request.
    refreshIntervalSeconds:
      type: integer
      default: 86400
      minimum: 30
      description: >-
        Cache TTL for the asset's DQ score. A request only re-authenticates to CDGC and
        refreshes the cached score (fresh Login+JWT, no token caching/refresh logic) if
        the cached entry is older than this. CDGC DQ scans run roughly daily, so 24h
        (the default) is a reasonable real-world value, not just a demo shortcut.
    failOpenOnCdgcError:
      type: boolean
      default: true
      description: >-
        Posture for a *transient* CDGC error on an asset whose score is already known. If a
        stale-cache refresh fails (timeout, auth failure, 5xx) but a last-known-good cached score
        exists, keep serving it when true (fail-open on cache). If false, treat the failure as an
        unknown score and apply blockOnUnknownScore instead. Orthogonal to blockOnUnknownScore:
        this governs known-asset transient errors; that governs the no-score-at-all case.
    blockOnUnknownScore:
      type: boolean
      default: true
      description: >-
        Posture when NO score is available at all (cold worker start before the first fetch, or a
        failOpenOnCdgcError=false failure with an empty cache). Default true = fail-CLOSED: the gate
        blocks rather than silently passing ungated traffic during the exact windows (startup, CDGC
        outage) an operator is least likely to notice. Set false only for a deliberate soft launch,
        which passes such traffic through ungated (a one-time warn marks the bypass window).
    discloseScoreDetails:
      type: boolean
      default: false
      description: >-
        When true, disclose the exact DQ score, blockThreshold, and asset id to the MCP or
        A2A client — in the block message (A2A v1.0: in the ErrorInfo metadata) and via the
        x-dq-gate-score response header (opt-in).
        When false (default, recommended), the client sees only a generic block message and
        the coarse x-dq-gate-status header (ok/warn/blocked/skipped/unknown); the exact
        score, threshold, and asset id are logged server-side only. Keeping this off prevents
        clients from probing threshold boundaries or learning internal asset identifiers.
    distributed:
      type: boolean
      default: false
      description: >-
        Share the cached DQ score and refresh lock across gateway replicas via
        gossip-replicated storage (requires shared storage configured on the
        gateway). When false (default), each replica keeps its own in-memory
        cache and refreshes independently.
    timeout:
      type: integer
      default: 5000
      description: >-
        Per-call timeout in milliseconds for each CDGC HTTP request (Login, JWT, Detail). Because a
        cache-miss request performs all three inline on the hot path, each call is additionally
        clamped to the remaining overall refresh budget (a fixed ~10s cap on the whole chain); if
        that budget is exhausted the refresh aborts and the unknown-score posture applies, rather
        than blocking the agent's call unbounded.
  required:
    - cdgcLoginUrl
    - cdgcBaseApiUrl
    - cdgcOrgUsername
    - cdgcOrgPassword
    - cdgcAssetId
    - warnThreshold
    - blockThreshold
