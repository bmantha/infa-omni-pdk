services:
  backend:
    image: httpmock/httpmock:0.8.3
    pull_policy: never
    environment:
      HTTPMOCK_PORT: "5000"
  tls:
    image: nginx:alpine@sha256:785835ea65db4bba6f021acc0f3be91b0fef76a53fe41f8588c6698d2aed0606
    pull_policy: never
    volumes:
      - ${TLS_FIXTURES}/nginx.conf:/etc/nginx/nginx.conf:ro
      - ${TLS_RUNTIME}/certs:/certs:ro
      - gateway-state:/gateway-state:ro
    networks:
      default:
        aliases: [tls-login, tls-api, tls-wrong]
      control: {}
    ports:
      - "127.0.0.1:${TLS_CONTROL_PORT}:5000"
      - "127.0.0.1::8081"
  flex:
    user: root
    image: mulesoft/flex-gateway:1.13.0
    pull_policy: never
    volumes:
      - ${TLS_RUNTIME}/flex:/usr/local/share/mulesoft/flex-gateway/conf.d/test:ro
      - ${TLS_POLICY_DIR}:/usr/local/share/mulesoft/flex-gateway/conf.d/policy:ro
      - gateway-state:/var/tmp/mulesoft/flex-gateway
volumes:
  gateway-state: {}
networks:
  default:
    internal: true
  control: {}
