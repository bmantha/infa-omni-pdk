user root;
events {}
http {
  access_log /dev/stdout;
  error_log /dev/stderr info;
  server {
    listen 5000;
    location = /__tls_clusters {
      proxy_pass http://unix:/gateway-state/flex-gw-admin.sock:/config_dump;
    }
    location /__tls_schema_control/ {
      proxy_pass http://flex:8082/;
    }
    location / { proxy_pass http://backend:5000; }
  }
  server {
    listen 8081;
    location / { proxy_pass http://flex:8081; }
  }
  server {
    listen 443 ssl;
    ssl_certificate /certs/server.crt;
    ssl_certificate_key /certs/server.key;
    location / {
      proxy_pass http://backend:5000;
    }
  }
}
