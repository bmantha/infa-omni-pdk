---
apiVersion: gateway.mulesoft.com/v1alpha1
kind: ApiInstance
metadata:
  name: ingress-http
spec:
  address: http://0.0.0.0:8081
  services:
    upstream:
      address: http://backend
      routes:
        - config:
            destinationPath: /anything/mcp/
  policies:
    - policyRef:
        name: dq-gate-policy-flex-v1-0 # This value will be overriden during 'make run' execution
        namespace: default
      config:
        cdgcLoginUrl: http://cdgclogin
        cdgcBaseApiUrl: http://cdgcapi
        cdgcOrgUsername: dummy-cdgc-username
        cdgcOrgPassword: dummy-cdgc-password
        cdgcAssetId: demo-asset-1
        warnThreshold: 90
        blockThreshold: 70
        scoreAggregation: min
        # Shortened from the real-world 86400s (24h) default so a `PUT /score` against the
        # cdgcapi mock (see mocks/mock_server.py) is visible within a demo-friendly window,
        # instead of requiring a 24h wait for the cache to go stale.
        refreshIntervalSeconds: 30
        failOpenOnCdgcError: true
        blockOnUnknownScore: false
        objectStoreAuthUrl: http://objectstoreauth/token
        objectStoreUrl: http://objectstore
        objectStoreClientId: dummy-client-id
        objectStoreClientSecret: dummy-client-secret
        objectStoreName: dq-gate-demo-store
