[package]
name = "dq_gate_policy"
version = "1.0.0"
rust-version = "1.88.0"
edition = "2018"
resolver = "2"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[package.metadata.anypoint]
group_id = "69d99156-4126-4837-8344-c40da72c73d3"
definition_asset_id = "dq-gate-policy"
implementation_asset_id = "dq-gate-policy-flex"

[dependencies]
pdk = { version = "1.10.0" }
serde = { version = "1.0", features = ["derive"] }
serde_json = { version = "1.0", default-features = false, features = ["alloc"] }
anyhow = "1.0"

[dev-dependencies]
pdk-test = { version = "1.10.0" }
pdk-unit = { version = "1.10.0" }
httpmock = "0.6"
reqwest = { version = "0.11", features = ["json"] }

[lib]
crate-type = ["cdylib"]

[profile.release]
lto = true
opt-level = 'z'
strip = "debuginfo"
